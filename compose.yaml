# Stack seedbox: le app che usano /data (Jellyfin gira in un ambiente separato) —
# avviato al boot dal servizio OpenRC `seedbox`, si ferma con il mount rclone.
# NPM, Prowlarr, Seerr e la pagina di stato sono in core.yaml (seedbox-core).
# Tutto il traffico in uscita dell'host passa da wg0 (wg-quick full tunnel),
# quindi anche quello dei container in bridge. qBittorrent usa la rete host
# per potersi legare direttamente a wg0 (kill switch).
# /data può essere un mount rclone di Backblaze B2 (servizio OpenRC rclone-b2):
# :rslave fa vedere ai container un eventuale remount; i download incompleti
# vanno direttamente su /data (cartella incompleti disattivata in qBittorrent).

x-common: &common
  restart: on-failure  # non unless-stopped: il servizio podman li avvierebbe al boot prima del mount
  networks: [seedbox]
  extra_hosts:
    - "host.containers.internal:host-gateway"

x-lsio-env: &lsio-env
  PUID: ${PUID}
  PGID: ${PGID}
  UMASK: "002"
  TZ: ${TZ}

name: seedbox

services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: on-failure
    network_mode: host
    environment:
      <<: *lsio-env
      WEBUI_PORT: "8080"
    volumes:
      - ./config/qbittorrent:/config
      - ${LOCAL_INCOMPLETE:-/srv/seedbox/incomplete}:/incomplete
      - ${DATA_ROOT}:/data:rslave

  sonarr:
    <<: *common
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment: *lsio-env
    ports: ["8989:8989"]
    volumes:
      - ./config/sonarr:/config
      - ${DATA_ROOT}:/data:rslave

  radarr:
    <<: *common
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment: *lsio-env
    ports: ["7878:7878"]
    volumes:
      - ./config/radarr:/config
      - ${DATA_ROOT}:/data:rslave

  lidarr:
    <<: *common
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    environment: *lsio-env
    ports: ["8686:8686"]
    volumes:
      - ./config/lidarr:/config
      - ${DATA_ROOT}:/data:rslave

  # Libri e audiolibri: cerca (indexer da Prowlarr), scarica con qBittorrent
  # (categoria books) e sistema in /data/media/books e /data/media/audiobooks.
  # Sostituisce Readarr, ritirato upstream nel 2025.
  lazylibrarian:
    <<: *common
    image: lscr.io/linuxserver/lazylibrarian:latest
    container_name: lazylibrarian
    environment: *lsio-env
    ports: ["5299:5299"]
    volumes:
      - ./config/lazylibrarian:/config
      - ${DATA_ROOT}:/data:rslave

  # Lettura e ascolto (app per telefono): librerie su /data/media/books e /audiobooks.
  # Su FUSE il watcher dei file non funziona: le librerie si rianalizzano a orario.
  audiobookshelf:
    <<: *common
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    environment:
      TZ: ${TZ}
    ports: ["13378:80"]
    volumes:
      - ./config/audiobookshelf/config:/config
      - ./config/audiobookshelf/metadata:/metadata
      - ${DATA_ROOT}:/data:rslave

  bazarr:
    <<: *common
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment: *lsio-env
    ports: ["6767:6767"]
    volumes:
      - ./config/bazarr:/config
      - ${DATA_ROOT}:/data:rslave

  # File manager web su /data (fm.casa.local): spostamenti e rinomine finiscono
  # cifrati su B2 tramite il mount rclone. Admin creato da setup.sh.
  filebrowser:
    <<: *common
    image: docker.io/filebrowser/filebrowser:v2.63.23-s6
    container_name: filebrowser
    environment: *lsio-env
    ports: ["8085:80"]
    volumes:
      - ./config/filebrowser/config:/config
      - ./config/filebrowser/database:/database
      - ${DATA_ROOT}:/srv:rslave

networks:
  seedbox:
    name: seedbox
    external: true
