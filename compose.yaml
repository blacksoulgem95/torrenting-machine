# Stack seedbox: le app che usano /data (Jellyfin gira in un ambiente separato) —
# avviato al boot dal servizio OpenRC `seedbox`, si ferma con il mount rclone.
# NPM, Prowlarr, Seerr e la pagina di stato sono in core.yaml (seedbox-core).
# Tutto il traffico in uscita dell'host passa da wg0 (wg-quick full tunnel),
# quindi anche quello dei container in bridge. qBittorrent usa la rete host
# per potersi legare direttamente a wg0 (kill switch).
# /data può essere un mount rclone di Backblaze B2 (servizio OpenRC rclone-b2):
# :rslave fa vedere ai container un eventuale remount; i download incompleti
# vanno direttamente su /data (cartella incompleti disattivata in qBittorrent).

x-common: &common
  restart: unless-stopped
  networks: [seedbox]
  extra_hosts:
    - "host.containers.internal:host-gateway"

x-lsio-env: &lsio-env
  PUID: ${PUID}
  PGID: ${PGID}
  UMASK: "002"
  TZ: ${TZ}

name: seedbox

services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    network_mode: host
    environment:
      <<: *lsio-env
      WEBUI_PORT: "8080"
    volumes:
      - ./config/qbittorrent:/config
      - ${LOCAL_INCOMPLETE:-/srv/seedbox/incomplete}:/incomplete
      - ${DATA_ROOT}:/data:rslave

  sonarr:
    <<: *common
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment: *lsio-env
    ports: ["8989:8989"]
    volumes:
      - ./config/sonarr:/config
      - ${DATA_ROOT}:/data:rslave

  radarr:
    <<: *common
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment: *lsio-env
    ports: ["7878:7878"]
    volumes:
      - ./config/radarr:/config
      - ${DATA_ROOT}:/data:rslave

  lidarr:
    <<: *common
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    environment: *lsio-env
    ports: ["8686:8686"]
    volumes:
      - ./config/lidarr:/config
      - ${DATA_ROOT}:/data:rslave

  # Readarr è stato ritirato upstream (2025): abilitalo con COMPOSE_PROFILES=readarr
  readarr:
    <<: *common
    image: lscr.io/linuxserver/readarr:develop
    container_name: readarr
    profiles: [readarr]
    environment: *lsio-env
    ports: ["8787:8787"]
    volumes:
      - ./config/readarr:/config
      - ${DATA_ROOT}:/data:rslave

  bazarr:
    <<: *common
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment: *lsio-env
    ports: ["6767:6767"]
    volumes:
      - ./config/bazarr:/config
      - ${DATA_ROOT}:/data:rslave

  # File manager web su /data (fm.casa.local): spostamenti e rinomine finiscono
  # cifrati su B2 tramite il mount rclone. Admin creato da setup.sh.
  filebrowser:
    <<: *common
    image: docker.io/filebrowser/filebrowser:v2.63.23-s6
    container_name: filebrowser
    environment: *lsio-env
    ports: ["8085:80"]
    volumes:
      - ./config/filebrowser/config:/config
      - ./config/filebrowser/database:/database
      - ${DATA_ROOT}:/srv:rslave

networks:
  seedbox:
    name: seedbox
    external: true
