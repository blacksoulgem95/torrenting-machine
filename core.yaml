# Stack "core": servizi che non usano /data, avviati dal servizio OpenRC
# `seedbox-core`. Restano su anche quando il mount rclone (e lo stack
# `seedbox` in compose.yaml) si ferma o si riavvia.
# La rete `seedbox` è condivisa tra i due stack (la crea seedbox-core):
# NPM raggiunge le app dell'altro stack per nome del container.

x-common: &common
  restart: unless-stopped
  networks: [seedbox]
  extra_hosts:
    - "host.containers.internal:host-gateway"

x-lsio-env: &lsio-env
  PUID: ${PUID}
  PGID: ${PGID}
  UMASK: "002"
  TZ: ${TZ}

name: seedbox-core

services:
  nginx-proxy-manager:
    <<: *common
    image: docker.io/jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    environment:
      TZ: ${TZ}
      INITIAL_ADMIN_EMAIL: ${NPM_ADMIN_EMAIL}
      INITIAL_ADMIN_PASSWORD: ${NPM_ADMIN_PASSWORD}
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    volumes:
      - ./config/npm/data:/data
      - ./config/npm/letsencrypt:/etc/letsencrypt

  prowlarr:
    <<: *common
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment: *lsio-env
    ports: ["9696:9696"]
    volumes:
      - ./config/prowlarr:/config

  seerr:
    <<: *common
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true
    environment:
      TZ: ${TZ}
      LOG_LEVEL: info
    ports: ["5055:5055"]
    volumes:
      - ./config/seerr:/app/config

  # Pagina di stato rclone/B2/dischi (rclone.casa.local). I dati li scrive
  # il servizio OpenRC seedbox-status in /var/lib/seedbox/status.
  rclone-status:
    <<: *common
    image: docker.io/library/busybox:1.37.0
    container_name: rclone-status
    command: ["httpd", "-f", "-p", "8080", "-h", "/www"]
    read_only: true
    volumes:
      - ./status/www:/www:ro
      - /var/lib/seedbox/status:/www/data:ro

  # Dashboard casa.local: link a tutti i servizi, con il loro stato
  # (data/services.json, scritto da seedbox-status) e quello di B2.
  home:
    <<: *common
    image: docker.io/library/busybox:1.37.0
    container_name: home
    command: ["httpd", "-f", "-p", "8080", "-h", "/www"]
    read_only: true
    volumes:
      - ./home/www:/www:ro
      - /var/lib/seedbox/status:/www/data:ro

networks:
  seedbox:
    name: seedbox
    external: true
